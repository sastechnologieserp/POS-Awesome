name: Release & Auto Tag

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'minor'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install packaging

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' posawesome/__init__.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Calculate new version
        id: new_version
        run: |
          from packaging.version import Version
          import os
          import sys
          
          current_version = "${{ steps.current_version.outputs.version }}"
          version_type = "${{ github.event.inputs.version_type }}"
          
          current = Version(current_version)
          major = current.major
          minor = current.minor
          patch = current.micro
          
          if version_type == "major":
              new_version = f"{major + 1}.0.0"
          elif version_type == "minor":
              new_version = f"{major}.{minor + 1}.0"
          else:  # patch
              new_version = f"{major}.{minor}.{patch + 1}"
          
          print(f"New version: {new_version}")
          print(f"new_version={new_version}", file=sys.stdout)
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"version={new_version}\n")
        shell: python

      - name: Update version in __init__.py
        run: |
          sed -i 's/__version__ = "[^"]*"/__version__ = "${{ steps.new_version.outputs.version }}"/' posawesome/__init__.py
          echo "Updated version to ${{ steps.new_version.outputs.version }}"

      - name: Verify version update
        run: |
          grep "__version__" posawesome/__init__.py

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit version change
        run: |
          git add posawesome/__init__.py
          git commit -m "chore: bump version to ${{ steps.new_version.outputs.version }}"

      - name: Create and push tag
        run: |
          git tag -a "v${{ steps.new_version.outputs.version }}" -m "Release version ${{ steps.new_version.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.new_version.outputs.version }}"

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ steps.new_version.outputs.version }}"
          release_name: "Release ${{ steps.new_version.outputs.version }}"
          body: |
            ## Release Notes
            
            Version bumped from ${{ steps.current_version.outputs.version }} to ${{ steps.new_version.outputs.version }}
            
            ### Version Type
            - ${{ github.event.inputs.version_type }}
            
            This is an automated release created by the GitHub Actions workflow.
          draft: false
          prerelease: false
